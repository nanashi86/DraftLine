<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- DraftLine's red "D" mark: SVG for tabs and bookmarks, PNG for browsers without SVG icons.
         ?v= is the icon version: bump it (here and in manifest.json) when the icons are redrawn, so
         browsers drop the favicon / bookmark / installed-app icon they cached under the old URL. -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icon-192.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Installable, offline-capable app (PWA): manifest + service worker (src/pwa/). -->
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <meta name="theme-color" content="#18181b" />
    <!-- Search and sharing: one title and description everywhere (tab, search result, link previews).
         The title must match SEO_TITLE in src/lib/pageTitle.js. Link previews need absolute URLs. -->
    <link rel="canonical" href="https://nanashi86.github.io/DraftLine/" />
    <meta name="description" content="DraftLine is a 100% free, open-source, local-first screenwriting tool. Fast and distraction-free with strict 54-line Hollywood pagination, 4-act index card beat board, and FDX/Fountain export with no subscriptions or accounts required." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DraftLine" />
    <meta property="og:url" content="https://nanashi86.github.io/DraftLine/" />
    <meta property="og:title" content="DraftLine — Fast, Distraction-Free Screenwriting Software (PWA)" />
    <meta property="og:description" content="DraftLine is a 100% free, open-source, local-first screenwriting tool. Fast and distraction-free with strict 54-line Hollywood pagination, 4-act index card beat board, and FDX/Fountain export with no subscriptions or accounts required." />
    <meta property="og:image" content="https://nanashi86.github.io/DraftLine/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DraftLine: fast, distraction-free screenwriting. Free." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://nanashi86.github.io/DraftLine/" />
    <meta name="twitter:title" content="DraftLine — Fast, Distraction-Free Screenwriting Software (PWA)" />
    <meta name="twitter:description" content="DraftLine is a 100% free, open-source, local-first screenwriting tool. Fast and distraction-free with strict 54-line Hollywood pagination, 4-act index card beat board, and FDX/Fountain export with no subscriptions or accounts required." />
    <meta name="twitter:image" content="https://nanashi86.github.io/DraftLine/og-image.png" />
    <!-- Google Search Console ownership check for the published site: leave it in place, or the site is unverified. -->
    <meta name="google-site-verification" content="DrCDehHt3vN0jJh4gijIObittLvGD1iLPm2yA6TGQrA" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png?v=2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DraftLine" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The UI font (Inter) loads first: it blocks rendering. The script font, Courier Prime, ships
         with DraftLine (src/index.css), so it's the same on every device and offline. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Title Page fonts (src/lib/titleFonts.js): loaded without blocking the first paint, and with
         display=swap each font file is only downloaded when a title actually uses it. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cinzel+Decorative:wght@400;700&family=Playfair+Display:wght@400;700&family=Cormorant+Garamond:wght@400;700&family=Abril+Fatface&family=Rye&family=Montserrat:wght@400;800&family=Roboto:wght@400;700&family=Zen+Maru+Gothic:wght@400;700&family=Oswald:wght@400;700&family=Bebas+Neue&family=Orbitron:wght@400;800&family=Audiowide&family=Amatic+SC:wght@400;700&family=Special+Elite&family=Great+Vibes&family=Pacifico&family=Caveat:wght@400;700&family=Google+Sans:wght@400;700&family=Anta&family=Asimovian&family=Boldonse&family=Manufacturing+Consent&family=Anton+SC&family=Danfo&family=Sankofa+Display&family=Matemasie&family=Tilt+Neon&family=Doto:wght@400;800&family=Tiny5&family=Playwrite+ZA&family=Playwrite+US+Modern&family=Delicious+Handrawn&family=Mynerve&family=Bonheur+Royale&family=Miss+Fajardose&display=swap"

    </noscript>
    <!-- Search engines index this. The app keeps it on the demo script (src/lib/pageTitle.js) and names the
         tab after the script once you're working on your own. -->
    <title>DraftLine — Fast, Distraction-Free Screenwriting Software (PWA)</title>
    <!-- Cloudflare Web Analytics, skipped on the admin's own devices. Visit once with ?dev=true to mark this
         browser as admin (?dev=false clears it); the parameter is then removed from the address bar. The beacon
         is cross-origin, so the service worker never touches it, and nothing here uses IndexedDB. -->
    <script>
      (function () {
        var KEY = 'draftline_is_admin';
        var admin = false;
        try {
          var url = new URL(window.location.href);
          var dev = url.searchParams.get('dev');
          if (dev === 'true' || dev === 'false') {
            admin = dev === 'true';
            try {
              if (admin) localStorage.setItem(KEY, 'true');
              else localStorage.removeItem(KEY);
            } catch (e) { /* storage blocked: still skip analytics for this visit */ }
            url.searchParams.delete('dev');
            window.history.replaceState(window.history.state, '', url.pathname + url.search + url.hash);
          }
          try { admin = admin || localStorage.getItem(KEY) === 'true'; } catch (e) { /* no storage */ }
        } catch (e) { /* very old browser: fall through and load analytics */ }
        if (admin) return;
        var beacon = document.createElement('script');
        beacon.defer = true;
        beacon.src = 'https://static.cloudflareinsights.com/beacon.min.js';
        beacon.setAttribute('data-cf-beacon', '{"token": "12fb1a12f74a4632b8201f0cb4563745"}');
        document.head.appendChild(beacon);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
